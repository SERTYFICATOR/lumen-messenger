<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen — мессенджер</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <div class="auth hidden" id="authScreen">
    <div class="auth__card">
      <div class="auth__logo">Lumen</div>
      <p class="auth__subtitle">Войдите по номеру телефона</p>
      <div class="auth__step" id="authStepPhone">
        <label class="auth__label">Номер телефона</label>
        <input type="tel" id="authPhone" placeholder="+7 900 000-00-00" autocomplete="tel">
        <button class="auth__btn" id="authSendCode">Продолжить</button>
      </div>
      <div class="auth__step hidden" id="authStepPassword">
        <label class="auth__label">Облачный пароль</label>
        <input type="password" id="authPassword" placeholder="Введите пароль" maxlength="50">
        <p class="auth__hint">Введите пароль, установленный для этого аккаунта</p>
        <button class="auth__btn" id="authVerifyPassword">Войти</button>
        <button class="auth__link" id="authBackFromPass">← Изменить номер</button>
      </div>
      <div class="auth__step hidden" id="authStepCode">
        <label class="auth__label">Введите код из 5 цифр</label>
        <input type="text" id="authCode" placeholder="•••••" maxlength="5" inputmode="numeric">
        <p class="auth__hint" id="authCodeHint"></p>
        <button class="auth__btn" id="authVerifyCode">Войти</button>
        <button class="auth__link" id="authBack">← Изменить номер</button>
      </div>
      <div class="auth__step hidden" id="authStepName">
        <label class="auth__label">Как вас зовут?</label>
        <input type="text" id="authName" placeholder="Имя" maxlength="40">
        <label class="auth__label">Username</label>
        <input type="text" id="authUsername" placeholder="username" maxlength="32">
        <button class="auth__btn" id="authFinish">Завершить регистрацию</button>
      </div>
    </div>
  </div>

  <div class="app-inner hidden" id="appInner">
    <aside class="sidebar" id="sidebar">
      <header class="sidebar__header">
        <button class="icon-btn" id="menuBtn" title="Меню">☰</button>
        <div class="search">
          <span class="search__icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Поиск">
        </div>
        <button class="icon-btn" id="newChatBtn" title="Добавить друга">✏️</button>
      </header>
      <div class="stories-bar" id="storiesBar"></div>
      <ul class="chat-list" id="chatList"></ul>
      <nav class="sidebar__nav">
        <button class="nav-btn active" data-tab="chats">💬<span>Чаты</span></button>
        <button class="nav-btn" data-tab="stories">⭕<span>Истории</span></button>
        <button class="nav-btn" data-tab="friends">👥<span>Друзья</span></button>
        <button class="nav-btn" data-tab="profile">👤<span>Профиль</span></button>
      </nav>
    </aside>

    <main class="chat" id="chat">
      <div class="chat__empty" id="chatEmpty">
        <div class="chat__empty-logo">Lumen</div>
        <p>Выберите чат, чтобы начать общение</p>
      </div>
      <div class="chat__window hidden" id="chatWindow">
        <header class="chat__header">
          <button class="icon-btn back-btn" id="backBtn" title="Назад">←</button>
          <div class="avatar" id="chatAvatar"></div>
          <div class="chat__title" id="chatTitleBtn">
            <div class="chat__name" id="chatName"></div>
            <div class="chat__status" id="chatStatus">в сети</div>
          </div>
          <button class="icon-btn" id="chatSearchBtn" title="Поиск">🔍</button>
          <button class="icon-btn" id="chatMenuBtn" title="Ещё">⋮</button>
        </header>
        <div class="messages" id="messages"></div>
        <footer class="composer">
          <button class="icon-btn" id="emojiBtn" title="Эмодзи">😊</button>
          <button class="icon-btn" id="attachBtn" title="Прикрепить">📎</button>
          <input type="text" id="messageInput" placeholder="Написать сообщение..." autocomplete="off">
          <button class="send-btn" id="sendBtn" title="Отправить">➤</button>
        </footer>
        <div class="emoji-panel hidden" id="emojiPanel">
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>
        <input type="file" id="attachInput" accept="image/*" class="hidden">
      </div>
    </main>

    <aside class="profile-panel hidden" id="profilePanel">
      <header class="profile-panel__header">
        <button class="icon-btn" id="closeProfileBtn">✕</button>
        <h3 id="profilePanelTitle">Настройки</h3>
      </header>
      <div class="profile-panel__body" id="profileBody"></div>
    </aside>
  </div>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="story-viewer hidden" id="storyViewer">
    <div class="story-viewer__progress"><div class="story-viewer__progress-bar" id="storyProgressBar"></div></div>
    <button class="icon-btn story-viewer__close" id="storyClose">✕</button>
    <div class="story-viewer__header" id="storyHeader"></div>
    <div class="story-viewer__media" id="storyMedia"></div>
    <div class="story-viewer__nav story-viewer__nav--left" id="storyPrev"></div>
    <div class="story-viewer__nav story-viewer__nav--right" id="storyNext"></div>
  </div>

  <div class="story-capture hidden" id="storyCapture">
    <video id="captureVideo" autoplay playsinline muted class="hidden"></video>
    <canvas id="captureCanvas" class="hidden"></canvas>
    <img id="capturePreview" class="hidden" alt="preview">
    <div class="story-capture__hint" id="captureHint">Наведите камеру или загрузите фото</div>
    <div class="story-capture__controls" id="captureControls">
      <button class="capture-btn" id="captureCancel">Отмена</button>
      <button class="capture-shutter" id="captureShutter" title="Снять"></button>
      <button class="capture-btn" id="captureUpload">📁 Файл</button>
    </div>
    <div class="story-capture__publish hidden" id="capturePublish">
      <input type="text" id="storyCaption" placeholder="Добавить подпись..." maxlength="120">
      <button class="send-btn" id="storyPublishBtn">➤</button>
    </div>
    <input type="file" id="storyFileInput" accept="image/*" class="hidden">
  </div>

  <div class="toast hidden" id="toast"></div>
</div>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="client.js"></script>
</body>
</html>
