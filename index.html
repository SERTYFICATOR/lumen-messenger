<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen — мессенджер</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root {
    --bg: #0e1621; --bg-secondary: #17212b; --bg-hover: #202b36;
    --bg-active: #2b5278; --text: #e9edf0; --text-muted: #7d8b99;
    --accent: #5288c1; --accent-light: #64b5f6;
    --bubble-in: #182533; --bubble-out: #2b5278;
    --border: #101921; --danger: #e57373; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; font-size: 15px; }
  .hidden { display: none !important; }

  /* AUTH */
  .auth { position: fixed; inset: 0; z-index: 500; background: radial-gradient(circle at 30% 20%, #1c2b3a, #0e1621 70%); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth__card { background: var(--bg-secondary); border-radius: 18px; padding: 32px 28px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .auth__logo { font-size: 36px; font-weight: 700; text-align: center; background: linear-gradient(135deg, var(--accent-light), var(--accent)); -webkit-background-clip: text; color: transparent; margin-bottom: 6px; }
  .auth__subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  .auth__step { display: flex; flex-direction: column; gap: 8px; }
  .auth__label { font-size: 12.5px; color: var(--accent-light); font-weight: 500; margin-top: 8px; }
  .auth__step input { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 16px; outline: none; }
  .auth__step input:focus { border-color: var(--accent); }
  .auth__btn { background: var(--accent); border: none; color: #fff; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  .auth__btn:hover { background: var(--accent-light); }
  .auth__btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth__link { background: transparent; border: none; color: var(--accent-light); cursor: pointer; font-size: 13.5px; margin-top: 10px; }
  .auth__hint { font-size: 11.5px; color: var(--text-muted); text-align: center; margin-top: 8px; }

  /* APP */
  .app-inner { display: flex; height: 100vh; max-width: 1600px; margin: 0 auto; position: relative; overflow: hidden; }
  .sidebar { width: 380px; min-width: 320px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar__header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 20px; padding: 6px 12px; }
  .search input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 14px; }
  .icon-btn { background: transparent; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }

  /* CHAT LIST */
  .chat-list { list-style: none; overflow-y: auto; flex: 1; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; }
  .chat-item:hover { background: var(--bg-hover); }
  .chat-item.active { background: var(--bg-active); }
  .avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; color: #fff; flex-shrink: 0; }
  .avatar.small { width: 40px; height: 40px; font-size: 16px; }
  .chat-item__body { flex: 1; min-width: 0; }
  .chat-item__top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .chat-item__name { font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item__time { font-size: 12px; color: var(--text-muted); }
  .chat-item__preview { font-size: 13.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .unread-badge { background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }

  /* NAV */
  .sidebar__nav { display: flex; border-top: 1px solid var(--border); background: var(--bg-secondary); }
  .nav-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 8px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 18px; }
  .nav-btn.active { color: var(--accent-light); }

  /* CHAT WINDOW */
  .chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; position: relative; }
  .chat__empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text-muted); }
  .chat__empty-logo { font-size: 48px; font-weight: 700; background: linear-gradient(135deg, var(--accent-light), var(--accent)); -webkit-background-clip: text; color: transparent; }
  .chat__window { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .chat__header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
  .chat__name { font-weight: 600; font-size: 15px; }

  /* MESSAGES */
  .messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 65%; display: flex; flex-direction: column; }
  .msg.in { align-self: flex-start; }
  .msg.out { align-self: flex-end; align-items: flex-end; }
  .bubble { padding: 8px 12px; border-radius: var(--radius); font-size: 14.5px; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
  .msg.in .bubble { background: var(--bubble-in); border-bottom-left-radius: 4px; }
  .msg.out .bubble { background: var(--bubble-out); border-bottom-right-radius: 4px; }
  .msg__meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  /* COMPOSER */
  .composer { display: flex; align-items: center; gap: 6px; padding: 10px 16px; background: var(--bg-secondary); border-top: 1px solid var(--border); }
  .composer input { flex: 1; background: var(--bg); border: none; outline: none; color: var(--text); font-size: 15px; padding: 10px 16px; border-radius: 20px; }
  .send-btn { background: var(--accent); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 16px; cursor: pointer; }

  /* PANEL */
  .profile-panel { position: absolute; top: 0; right: 0; bottom: 0; width: 380px; background: var(--bg-secondary); border-left: 1px solid var(--border); z-index: 20; display: flex; flex-direction: column; }
  .profile-panel__header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .profile-panel__body { flex: 1; overflow-y: auto; padding: 16px; }
  .profile-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
  .profile-field label { font-size: 12.5px; color: var(--accent-light); font-weight: 500; }
  .profile-field input { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 14.5px; outline: none; }
  .profile-save { width: 100%; background: var(--accent); border: none; color: #fff; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .profile-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; cursor: pointer; }
  .profile-item:hover { background: var(--bg-hover); }
  .profile-item__text strong { display: block; font-size: 14.5px; }
  .profile-item__text span { font-size: 12.5px; color: var(--text-muted); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--bg-secondary); border-radius: 14px; padding: 24px; width: 90%; max-width: 420px; }
  .modal h3 { margin-bottom: 16px; font-size: 18px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .modal-btn { background: transparent; border: none; color: var(--accent-light); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14.5px; font-weight: 500; }
  .modal-btn.primary { background: var(--accent); color: #fff; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; }
  .modal-field input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14.5px; outline: none; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--bg-active); color: #fff; padding: 12px 22px; border-radius: 24px; font-size: 14px; z-index: 300; }
</style>
</head>
<body>
<div class="app">
  <!-- ЭКРАН ВХОДА -->
  <div class="auth hidden" id="authScreen">
    <div class="auth__card">
      <div class="auth__logo">Lumen</div>
      <p class="auth__subtitle">Войдите по номеру телефона</p>
      <div class="auth__step" id="authStepPhone">
        <label class="auth__label">Номер телефона</label>
        <input type="tel" id="authPhone" placeholder="+7 900 000-00-00">
        <button class="auth__btn" id="authSendCode">Продолжить</button>
      </div>
      <div class="auth__step hidden" id="authStepPassword">
        <label class="auth__label">Облачный пароль</label>
        <input type="password" id="authPassword" placeholder="Введите пароль">
        <button class="auth__btn" id="authVerifyPassword">Войти</button>
        <button class="auth__link" id="authBackFromPass">← Назад</button>
      </div>
      <div class="auth__step hidden" id="authStepCode">
        <label class="auth__label">Введите код из 5 цифр</label>
        <input type="text" id="authCode" placeholder="•••••" maxlength="5">
        <p class="auth__hint" id="authCodeHint"></p>
        <button class="auth__btn" id="authVerifyCode">Войти</button>
        <button class="auth__link" id="authBack">← Назад</button>
      </div>
      <div class="auth__step hidden" id="authStepName">
        <label class="auth__label">Как вас зовут?</label>
        <input type="text" id="authName" placeholder="Имя">
        <label class="auth__label">Username</label>
        <input type="text" id="authUsername" placeholder="username">
        <button class="auth__btn" id="authFinish">Завершить</button>
      </div>
    </div>
  </div>

  <!-- ПРИЛОЖЕНИЕ -->
  <div class="app-inner hidden" id="appInner">
    <aside class="sidebar">
      <header class="sidebar__header">
        <button class="icon-btn" id="menuBtn">☰</button>
        <div class="search">
          <input type="text" id="searchInput" placeholder="Поиск">
        </div>
        <button class="icon-btn" id="newChatBtn">✏️</button>
      </header>
      <ul class="chat-list" id="chatList"></ul>
      <nav class="sidebar__nav">
        <button class="nav-btn active" data-tab="chats">💬<span>Чаты</span></button>
        <button class="nav-btn" data-tab="friends">👥<span>Друзья</span></button>
        <button class="nav-btn" data-tab="profile">👤<span>Профиль</span></button>
      </nav>
    </aside>

    <main class="chat">
      <div class="chat__empty" id="chatEmpty">
        <div class="chat__empty-logo">Lumen</div>
        <p>Выберите чат</p>
      </div>
      <div class="chat__window hidden" id="chatWindow">
        <header class="chat__header">
          <div class="avatar small" id="chatAvatar"></div>
          <div class="chat__name" id="chatName"></div>
        </header>
        <div class="messages" id="messages"></div>
        <footer class="composer">
          <input type="text" id="messageInput" placeholder="Написать сообщение...">
          <button class="send-btn" id="sendBtn">➤</button>
        </footer>
      </div>
    </main>

    <aside class="profile-panel hidden" id="profilePanel">
      <header class="profile-panel__header">
        <button class="icon-btn" id="closeProfileBtn">✕</button>
        <h3 id="profilePanelTitle">Меню</h3>
      </header>
      <div class="profile-panel__body" id="profileBody"></div>
    </aside>
  </div>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast hidden" id="toast"></div>
</div>

<script>
  // 1. Правильное определение API (на Render работает через относительные пути)
  const API = '/api';
  let socket = null;

  // 2. Проверка загрузки Socket.IO
  try {
    if (typeof io !== 'undefined') {
      socket = io();
    } else {
      console.warn("Socket.IO не загрузился. Уведомления работать не будут.");
    }
  } catch (e) {
    console.error("Ошибка инициализации Socket.IO", e);
  }

  const $ = id => document.getElementById(id);
  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase() || '?';
  const randColor = () => ['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8','#4db6ac'][Math.floor(Math.random()*6)];

  let currentUser = null;
  let DB = { users: [], messages: [], stories: [] };
  let activeChatId = null;

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 3000);
  }

  function openModal(html) { $('modal').innerHTML = html; $('modalOverlay').classList.remove('hidden'); }
  function closeModal() { $('modalOverlay').classList.add('hidden'); }
  $('modalOverlay').onclick = e => { if (e.target.id === 'modalOverlay') closeModal(); };

  // 3. Безопасная загрузка данных
  async function loadDB() {
    try {
      const res = await fetch(`${API}/db`);
      if (!res.ok) throw new Error('Сервер вернул ошибку');
      DB = await res.json();
      renderChats();
    } catch (e) {
      console.error(e);
      toast('Ошибка сети. Проверьте интернет или сервер.');
    }
  }

  function showAuthScreen() {
    $('authScreen').classList.remove('hidden');
    $('appInner').classList.add('hidden');
    $('authStepPhone').classList.remove('hidden');
    $('authStepPassword').classList.add('hidden');
    $('authStepCode').classList.add('hidden');
    $('authStepName').classList.add('hidden');
  }

  function showApp(user) {
    currentUser = user;
    localStorage.setItem('lumen_user', JSON.stringify(user));
    $('authScreen').classList.add('hidden');
    $('appInner').classList.remove('hidden');
    if (socket) socket.emit('join', currentUser.phone);
    loadDB();
  }

  // --- АВТОРИЗАЦИЯ ---
  let pendingPhone = '', pendingCode = '';

  $('authSendCode').onclick = async () => {
    const phone = $('authPhone').value.trim();
    if (!phone) { toast('Введите номер'); return; }
    
    // Блокируем кнопку, чтобы не было двойных кликов
    $('authSendCode').disabled = true;
    $('authSendCode').textContent = 'Загрузка...';

    try {
      const res = await fetch(`${API}/auth/check`, { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ phone }) 
      });
      
      const data = await res.json();
      pendingPhone = phone;
      $('authStepPhone').classList.add('hidden');
      
      if (data.exists && data.requiresPassword) {
        $('authStepPassword').classList.remove('hidden');
      } else if (data.exists) {
        showApp(data.user);
      } else {
        pendingCode = String(Math.floor(10000 + Math.random() * 90000));
        $('authCodeHint').textContent = `Демо-код: ${pendingCode}`;
        $('authStepCode').classList.remove('hidden');
      }
    } catch (e) {
      console.error(e);
      toast('Ошибка соединения с сервером');
      $('authStepPhone').classList.remove('hidden'); // Возвращаем назад при ошибке
    } finally {
      $('authSendCode').disabled = false;
      $('authSendCode').textContent = 'Продолжить';
    }
  };

  $('authVerifyPassword').onclick = async () => {
    const password = $('authPassword').value.trim();
    if (!password) return toast('Введите пароль');
    try {
      const res = await fetch(`${API}/auth/verify-password`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: pendingPhone, password }) });
      const data = await res.json();
      if (res.ok) showApp(data.user); else toast(data.error);
    } catch(e) { toast('Ошибка сервера'); }
  };

  $('authBackFromPass').onclick = () => { $('authStepPassword').classList.add('hidden'); $('authStepPhone').classList.remove('hidden'); };
  $('authBack').onclick = () => { $('authStepCode').classList.add('hidden'); $('authStepPhone').classList.remove('hidden'); };

  $('authVerifyCode').onclick = () => {
    if ($('authCode').value.trim() !== pendingCode) { toast('Неверный код'); return; }
    $('authStepCode').classList.add('hidden');
    $('authStepName').classList.remove('hidden');
  };

  $('authFinish').onclick = async () => {
    const name = $('authName').value.trim();
    const username = $('authUsername').value.trim();
    if (!name || !username) return toast('Заполните поля');
    
    try {
      const res = await fetch(`${API}/auth/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: pendingPhone, name, username, color: randColor() }) });
      const data = await res.json();
      if (res.ok) showApp(data.user); else toast(data.error);
    } catch(e) { toast('Ошибка сервера'); }
  };

  // --- РЕНДЕР ---
  function renderChats() {
    if (!currentUser) return;
    const list = $('chatList');
    list.innerHTML = '';
    const contactPhones = new Set();
    DB.messages.forEach(m => {
      if (m.from === currentUser.phone) contactPhones.add(m.to);
      if (m.to === currentUser.phone) contactPhones.add(m.from);
    });

    contactPhones.forEach(phone => {
      const contact = DB.users.find(u => u.phone === phone);
      if (!contact) return;
      const msgs = DB.messages.filter(m => (m.from === currentUser.phone && m.to === phone) || (m.from === phone && m.to === currentUser.phone)).sort((a,b) => a.timestamp - b.timestamp);
      const last = msgs[msgs.length - 1];
      const unread = msgs.filter(m => m.from === phone && !m.read).length;

      const li = document.createElement('li');
      li.className = 'chat-item' + (activeChatId === phone ? ' active' : '');
      li.innerHTML = `
        <div class="avatar" style="background:${contact.color}">${esc(initials(contact.name))}</div>
        <div class="chat-item__body">
          <div class="chat-item__top">
            <span class="chat-item__name">${esc(contact.name)}</span>
            <span class="chat-item__time">${last ? last.time : ''}</span>
          </div>
          <div class="chat-item__preview">${last ? (last.from === currentUser.phone ? 'Вы: ' : '') + esc(last.text) : ''}</div>
        </div>
        ${unread ? `<span class="unread-badge">${unread}</span>` : ''}
      `;
      li.onclick = () => openChat(phone);
      list.appendChild(li);
    });
  }

  async function openChat(phone) {
    const contact = DB.users.find(u => u.phone === phone);
    activeChatId = phone;
    
    try {
      await fetch(`${API}/read`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: phone, to: currentUser.phone }) });
    } catch(e) { console.warn("Не удалось отметить прочитанным"); }

    $('chatEmpty').classList.add('hidden');
    $('chatWindow').classList.remove('hidden');
    $('chatName').textContent = contact.name;
    $('chatAvatar').textContent = initials(contact.name);
    $('chatAvatar').style.background = contact.color;
    await loadDB();
    renderMessages(contact);
  }

  function renderMessages(contact) {
    const box = $('messages');
    box.innerHTML = '';
    DB.messages.filter(m => (m.from === currentUser.phone && m.to === contact.phone) || (m.from === contact.phone && m.to === currentUser.phone))
      .sort((a,b) => a.timestamp - b.timestamp)
      .forEach(m => {
        const isOut = m.from === currentUser.phone;
        box.innerHTML += `<div class="msg ${isOut ? 'out' : 'in'}"><div class="bubble">${esc(m.text)}</div><div class="msg__meta"><span>${m.time}</span></div></div>`;
      });
    box.scrollTop = box.scrollHeight;
  }

  async function sendMessage() {
    const text = $('messageInput').value.trim();
    if (!text || !activeChatId) return;
    $('messageInput').value = '';
    
    try {
      await fetch(`${API}/message`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: currentUser.phone, to: activeChatId, text }) });
      await loadDB();
      renderMessages(DB.users.find(u => u.phone === activeChatId));
    } catch(e) { toast('Сообщение не отправлено. Нет связи.'); }
  }

  // --- СОБЫТИЯ ---
  if (socket) {
    socket.on('new_message', () => { 
      if (currentUser) loadDB().then(() => { 
        if (activeChatId) renderMessages(DB.users.find(u => u.phone === activeChatId)); 
      }); 
    });
    socket.on('messages_read', () => { if (currentUser) loadDB(); });
  }

  $('sendBtn').onclick = sendMessage;
  $('messageInput').onkeydown = e => { if (e.key === 'Enter') sendMessage(); };

  $('newChatBtn').onclick = () => {
    openModal(`
      <h3>Добавить друга</h3>
      <div class="modal-field"><label>Имя</label><input id="fName" placeholder="Имя"></div>
      <div class="modal-field"><label>Телефон</label><input id="fPhone" placeholder="+7 900 000-00-00"></div>
      <div class="modal-actions"><button class="modal-btn" onclick="closeModal()">Отмена</button><button class="modal-btn primary" id="fAdd">Добавить</button></div>
    `);
    $('fAdd').onclick = async () => {
      const name = $('fName').value.trim(), phone = $('fPhone').value.trim();
      if (!name || !phone) return;
      await fetch(`${API}/friend`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, phone, username: phone, color: randColor() }) });
      closeModal(); await loadDB(); openChat(phone);
    };
  };

  $('menuBtn').onclick = () => {
    openModal(`
      <h3>Меню</h3>
      <div class="profile-item" onclick="closeModal(); openProfilePanel();"><div class="profile-item__icon">👤</div><div class="profile-item__text"><strong>Профиль</strong></div></div>
      <div class="profile-item" onclick="localStorage.removeItem('lumen_user'); location.reload();"><div class="profile-item__icon">🚪</div><div class="profile-item__text"><strong>Выйти</strong></div></div>
      <div class="modal-actions"><button class="modal-btn" onclick="closeModal()">Закрыть</button></div>
    `);
  };

  $('closeProfileBtn').onclick = () => $('profilePanel').classList.add('hidden');

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.tab === 'profile') openProfilePanel();
      if (btn.dataset.tab === 'friends') openFriendsPanel();
      if (btn.dataset.tab === 'chats') $('profilePanel').classList.add('hidden');
    };
  });

  function openProfilePanel() {
    $('profilePanelTitle').textContent = 'Профиль';
    $('profileBody').innerHTML = `
      <div class="profile-field"><label>Имя</label><input id="pName" value="${esc(currentUser.name)}"></div>
      <button class="profile-save" id="pSave">Сохранить</button>
      <div class="profile-section-title" style="margin-top:20px; margin-bottom:10px; color:var(--text-muted); font-size:13px;">БЕЗОПАСНОСТЬ</div>
      <div class="profile-field"><label>Облачный пароль</label><input type="password" id="pPassword" placeholder="Установить пароль"></div>
      <button class="profile-save" id="pSavePass" style="background: var(--danger);">Обновить пароль</button>
    `;
    $('profilePanel').classList.remove('hidden');
    $('pSave').onclick = async () => { await fetch(`${API}/profile`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: currentUser.phone, name: $('pName').value }) }); toast('Сохранено'); loadDB(); };
    $('pSavePass').onclick = async () => { await fetch(`${API}/profile/password`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: currentUser.phone, newPassword: $('pPassword').value.trim() }) }); toast('Пароль установлен'); };
  }

  function openFriendsPanel() {
    $('profilePanelTitle').textContent = 'Друзья';
    $('profileBody').innerHTML = DB.users.filter(u => u.phone !== currentUser.phone).map(f => `
      <div class="profile-item" onclick="$('profilePanel').classList.add('hidden'); openChat('${f.phone}')">
        <div class="avatar small" style="background:${f.color}">${esc(initials(f.name))}</div>
        <div class="profile-item__text"><strong>${esc(f.name)}</strong><span>${f.phone}</span></div>
      </div>
    `).join('');
    $('profilePanel').classList.remove('hidden');
  }

  // --- СТАРТ ---
  const savedUser = JSON.parse(localStorage.getItem('lumen_user'));
  if (savedUser) showApp(savedUser); else showAuthScreen();
</script>
</body>
</html>
